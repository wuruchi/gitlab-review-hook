[project]
name = "gitlab-review-hook"
version = "0.1.0"
description = "GitLab LLM code review bot scaffold."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pyyaml",
    "requests",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-mock",
]

[project.scripts]
gitlab-review-hook = "src.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
